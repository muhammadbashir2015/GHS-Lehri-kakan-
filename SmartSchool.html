const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('sfa',6);r.onupgradeneeded=()=>{const d=r.result,t=r.transaction;if(!d.objectStoreNames.contains('people'))d.createObjectStore('people',{keyPath:'id',autoIncrement:true});const a=d.objectStoreNames.contains('att')?t.objectStore('att'):d.createObjectStore('att',{keyPath:'id',autoIncrement:true});if(!a.indexNames.contains('pd'))a.createIndex('pd',['pid','date'],{unique:true});if(!a.indexNames.contains('d'))a.createIndex('d','date');if(!d.objectStoreNames.contains('sms')){const m=d.createObjectStore('sms',{keyPath:'id',autoIncrement:true});m.createIndex('pdk',['pid','date','kind'],{unique:true});m.createIndex('d','date')}for(const n of FS)if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>ok(r.result);r.onerror=no});

async function merge(){DB=DB||await open();const SK='swa_offline_db_v1';let s={};try{s=JSON.parse(localStorage.getItem(SK))||{}}catch(x){}
 s.students=s.students||[];s.results=s.results||{};s.attendance=s.attendance||{};const ALL=await all('people'),P=ALL.filter(p=>p.type=='S'),keep=[];
 for(const ss of s.students){const gone=ALL.length>0&&ss.cid&&!ALL.some(p=>p.id==ss.cid),X=ss.cid&&ALL.find(p=>p.id==ss.cid&&p.type=='X');
  if(gone){rmRes(s,ss.id);delete s.attendance[ss.id];continue}

  let p=ss.cid?P.find(q=>q.id==ss.cid):P.find(q=>nm(q.cls)==nm(ss.class)&&nm(q.idNo)==nm(ss.roll));
  if(!p){p={type:'S',name:ss.name,father:ss.fatherName||'',idNo:ss.roll||'',cls:ss.class||'',sec:ss.section||'',phone:ss.whatsapp||'',desc:[],ssid:ss.id};p.id=await put('people',p);P.push(p);ALL.push(p)}
  else if(!ss.cid){let ch=0;if(!p.father&&ss.fatherName){p.father=ss.fatherName;ch=1}if(!p.phone&&ss.whatsapp){p.phone=ss.whatsapp;ch=1}if(ch)await put('people',p)}
  ss.cid=p.id;ss.admNo=p.admNo||'';ss.name=p.name;ss.fatherName=p.father||'';ss.roll=p.idNo;ss.class=p.cls||'';ss.section=p.sec||'';if(p.phone)ss.whatsapp=p.phone;keep.push(ss)}
